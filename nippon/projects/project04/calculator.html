<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/Calculator.css">
</head>
<body>
    <main id="container">
        <div class="buttons">
            <div class="first-row">
                <div id="AC">AC</div>
                <div id="C">C</div>
                <div id="precent">%</div>
                <div id="division">/</div>
            </div>
            <div class="second-row">
                <div id="seven">7</div>
                <div id="eight">8</div>
                <div id="nine">9</div>
                <div id="multiply">x</div>
            </div>
            <div class="third-row">
                <div id="four">4</div>
                <div id="five">5</div>
                <div id="six">6</div>
                <div id="subtract">-</div>

            </div>
            <div class="fourth-row">
                <div id="one">1</div>
                <div id="two">2</div>
                <div id="three">3</div>
                <div id="plus">+</div>
            </div>
            <div class="fifth-row">
                <div id="zero">0</div>
                <div id="dot">.</div>
                <div id="equal">=</div>
            </div>

        </div>
    </main>
    
</body>
</html>
